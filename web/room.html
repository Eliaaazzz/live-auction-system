<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Room (T2)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    #price { font-size: 40px; font-weight: 700; }
    #status, #countdown { color: #64748b; }
    #sold { display: none; font-weight: 700; color: #b45309; margin: 8px 0; }
    button { padding: 10px 18px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input { padding: 8px; font-size: 16px; width: 140px; }
    #feed { margin-top: 16px; font-family: ui-monospace, monospace; font-size: 13px; color: #334155; }
    .conn { color: #16a34a; } .down { color: #dc2626; }
    ol#leaderboard { padding-left: 22px; font-family: ui-monospace, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Auction room</h1>
  <div>auction: <code id="aid"></code> · <span id="conn" class="down">connecting…</span></div>
  <p>mode: <code id="mode">—</code></p>
  <p>current price: <span id="price">—</span> <small>cents</small></p>
  <p id="sealed-status" style="display:none;font-weight:600;color:#7c3aed">Sealed bid &middot; <span id="sealed-count">0</span> sealed bids placed (amounts hidden until reveal)</p>
  <p id="status">—</p>
  <p id="countdown">—</p>
  <p id="sold">SOLD</p>
  <div id="reveal" style="display:none;background:#f5f3ff;border:1px solid #c4b5fd;padding:10px;border-radius:6px;margin:8px 0">
    <strong>AUCTION_REVEALED</strong>
    <p style="margin:4px 0">Winner: <code id="reveal-winner"></code> · Final price: <code id="reveal-price"></code></p>
    <ol id="reveal-bids" style="font-family:ui-monospace,monospace;font-size:13px"></ol>
  </div>
  <input id="amount" type="number" value="11000" />
  <button id="bid">Place bid</button>
  <button id="evidence">Show evidence</button>

  <h3>Leaderboard</h3>
  <ol id="leaderboard"><li>—</li></ol>

  <pre id="evidence-out" style="background:#f1f5f9;padding:8px;border-radius:6px;font-size:12px;overflow:auto"></pre>
  <div id="feed"></div>

  <script>
    const qs = new URLSearchParams(location.search);
    const aid = qs.get('auction') || 'auc_demo';
    document.getElementById('aid').textContent = aid;

    const feed = (m) => {
      const d = document.createElement('div');
      d.textContent = new Date().toLocaleTimeString() + '  ' + m;
      document.getElementById('feed').prepend(d);
    };

    // seq-guard: mirror of apps/lumen/internal/seqguard (V9 §4.1). Applies events
    // strictly in order; drops duplicates (direct ack vs broadcast) and stale frames.
    function makeSeqGuard(last) {
      let cur = last > 0 ? last : 0;
      return {
        apply(s) { if (!s || s <= 0) return true; if (s <= cur) return false; cur = s; return true; },
        last() { return cur; },
      };
    }
    let guard = makeSeqGuard(0);

    let authToken = '';
    let endAtMs = 0, clockOffsetMs = 0, terminal = false;
    // Auction mode (issue #114). Sealed modes hide the price/leaderboard during
    // LIVE and emit SEALED_BID_RECEIVED (count only) → AUCTION_REVEALED (sorted
    // bids public at close). ENGLISH/SUDDEN_DEATH behave as before.
    let auctionMode = 'ENGLISH', sealedCount = 0;
    function isSealedMode(m) { return m === 'SEALED_FIRST' || m === 'VICKREY' || m === 'ALL_PAY' || m === 'PREQUALIFY'; }
    function applyModeUI(m) {
      auctionMode = m || 'ENGLISH';
      document.getElementById('mode').textContent = auctionMode;
      if (isSealedMode(auctionMode)) {
        document.getElementById('price').textContent = '— (sealed)';
        document.getElementById('sealed-status').style.display = '';
        document.getElementById('leaderboard').innerHTML = '<li>— (sealed; revealed at close)</li>';
      } else {
        document.getElementById('sealed-status').style.display = 'none';
      }
    }
    function syncClock(env) { if (env.serverTimeMs) clockOffsetMs = env.serverTimeMs - Date.now(); }
    setInterval(() => {
      if (!endAtMs || terminal) return;
      const remain = Math.max(0, endAtMs - (Date.now() + clockOffsetMs));
      document.getElementById('countdown').textContent = 'ends in ' + (remain / 1000).toFixed(1) + 's';
    }, 100);

    async function refreshLeaderboard() {
      if (!authToken) return;
      if (isSealedMode(auctionMode) && !terminal) {
        // Sealed-mode leaderboard is hidden during LIVE: the engine doesn't
        // write to the public lbKey ZSET until the reveal at close.
        document.getElementById('leaderboard').innerHTML = '<li>— (sealed; revealed at close)</li>';
        return;
      }
      try {
        const r = await (await fetch('/api/auctions/' + encodeURIComponent(aid) + '/leaderboard?n=5',
          { headers: { Authorization: 'Bearer ' + authToken } })).json();
        const ol = document.getElementById('leaderboard');
        ol.innerHTML = '';
        (r.leaderboard || []).forEach((e) => {
          const li = document.createElement('li');
          li.textContent = e.userId + '  —  ' + e.amountCents;
          ol.appendChild(li);
        });
        if (!ol.children.length) ol.innerHTML = '<li>—</li>';
      } catch (_) { /* leaderboard is best-effort UI */ }
    }

    function markTerminal(label, statusText) {
      terminal = true;
      document.getElementById('sold').style.display = 'block';
      document.getElementById('sold').textContent = label;
      document.getElementById('bid').disabled = true;
      document.getElementById('countdown').textContent = 'ended';
      if (statusText) document.getElementById('status').textContent = statusText;
    }

    let ws;
    async function connect() {
      const s = await (await fetch('/api/dev-login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname: 'Buyer ' + Math.floor(Math.random() * 1000), role: 'user' }),
      })).json();
      authToken = s.token;

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(s.token));

      ws.onopen = () => {
        document.getElementById('conn').textContent = 'connected as ' + s.userId;
        document.getElementById('conn').className = 'conn';
        ws.send(JSON.stringify({ type: 'ROOM_JOIN', auctionId: aid, serverTimeMs: Date.now(), data: { auctionId: aid } }));
      };
      ws.onclose = () => {
        document.getElementById('conn').className = 'down';
        // The server drops a slow/stuck client instead of silently losing critical
        // events; auto-reconnect + ROOM_SNAPSHOT re-syncs state (catchup is T5).
        if (terminal) { document.getElementById('conn').textContent = 'disconnected'; return; }
        document.getElementById('conn').textContent = 'disconnected — reconnecting…';
        setTimeout(connect, 1000);
      };
      ws.onmessage = (ev) => {
        const env = JSON.parse(ev.data);
        syncClock(env);
        switch (env.type) {
          case 'ROOM_SNAPSHOT':
            if ((env.seq || 0) < guard.last()) return; // stale snapshot after a newer event
            guard = makeSeqGuard(env.seq || 0); // prime cursor to snapshot seq
            if (env.data.endAtMs) endAtMs = env.data.endAtMs;
            applyModeUI(env.data.rules && env.data.rules.mode);
            render(env.data.currentPriceCents, env.data.status, env.seq);
            if (env.data.status === 'SOLD') markTerminal('SOLD', 'status: SOLD · seq: ' + env.seq);
            else if (env.data.status === 'NO_BID') markTerminal('NO BID', 'status: NO_BID · seq: ' + env.seq);
            else if (env.data.status === 'CANCELLED') markTerminal('CANCELLED by seller', 'status: CANCELLED · seq: ' + env.seq);
            feed('snapshot: ' + (env.data.status || '—'));
            refreshLeaderboard();
            break;
          case 'BID_ACCEPTED':
            if (!guard.apply(env.seq)) return; // duplicate (ack vs broadcast) / stale
            if (env.data.endAtMs) endAtMs = env.data.endAtMs;
            render(env.data.amountCents, env.data.status, env.seq);
            feed('BID_ACCEPTED seq=' + env.seq + ' by ' + env.data.userId + ' @ ' + env.data.amountCents);
            refreshLeaderboard();
            break;
          case 'AUCTION_EXTENDED':
            if (!guard.apply(env.seq)) return;
            if (env.data.endAtMs) endAtMs = env.data.endAtMs;
            feed('AUCTION_EXTENDED seq=' + env.seq + ' endAtMs=' + env.data.endAtMs + ' (#' + env.data.extendCount + ')');
            break;
          case 'AUCTION_SOLD':
            if (!guard.apply(env.seq)) return;
            markTerminal('SOLD to ' + env.data.winnerId + ' @ ' + env.data.amountCents, 'status: SOLD · seq: ' + env.seq);
            feed('AUCTION_SOLD seq=' + env.seq + ' winner=' + env.data.winnerId);
            break;
          case 'AUCTION_NO_BID':
            if (!guard.apply(env.seq)) return;
            markTerminal('NO BID (timer hammer, no bidders)', 'status: NO_BID · seq: ' + env.seq);
            feed('AUCTION_NO_BID seq=' + env.seq);
            break;
          case 'AUCTION_CANCELLED':
            if (!guard.apply(env.seq)) return;
            markTerminal('CANCELLED by seller', 'status: CANCELLED · seq: ' + env.seq);
            feed('AUCTION_CANCELLED seq=' + env.seq);
            break;
          case 'SEALED_BID_RECEIVED':
            // Sealed-mode broadcast (issue #114): proves a bid landed (running
            // count + display name + a SHA1 commit) WITHOUT the amount.
            if (!guard.apply(env.seq)) return;
            sealedCount = env.data.count || (sealedCount + 1);
            document.getElementById('sealed-count').textContent = sealedCount;
            feed('SEALED_BID_RECEIVED seq=' + env.seq + ' by ' + env.data.displayName + ' (count=' + sealedCount + ')');
            break;
          case 'AUCTION_REVEALED':
            // The sealed bids become public: render the sorted list, winner,
            // and final price (own bid for SEALED_FIRST, 2nd-highest for VICKREY).
            if (!guard.apply(env.seq)) return;
            document.getElementById('reveal').style.display = '';
            document.getElementById('reveal-winner').textContent = env.data.winnerId;
            document.getElementById('reveal-price').textContent = env.data.amountCents;
            const olR = document.getElementById('reveal-bids');
            olR.innerHTML = '';
            (env.data.bids || []).forEach((b, i) => {
              const li = document.createElement('li');
              li.textContent = (i+1) + '. ' + (b.displayName || b.userId) + '  —  ' + b.amountCents;
              olR.appendChild(li);
            });
            document.getElementById('price').textContent = env.data.amountCents;
            document.getElementById('sealed-status').style.display = 'none';
            feed('AUCTION_REVEALED seq=' + env.seq + ' winner=' + env.data.winnerId + ' @ ' + env.data.amountCents);
            break;
          case 'BID_REJECTED':
            // ERR_TOO_LOW covers both below-required AND over-cap (proto error-codes.md §3).
            feed('BID_REJECTED: ' + env.data.code); // unordered control frame
            break;
        }
      };
    }

    function render(price, status, seq) {
      // Sealed modes hide the price during LIVE — the snapshot's currentPriceCents
      // is the reserve (startPrice), not the leading bid, but we still don't want
      // to render it as a "current price" since it would suggest bidding activity
      // that the sealed engine deliberately conceals.
      if (price) {
        if (isSealedMode(auctionMode) && (status === 'LIVE' || !status) && !terminal) {
          document.getElementById('price').textContent = '— (sealed)';
        } else {
          document.getElementById('price').textContent = price;
        }
      }
      document.getElementById('status').textContent = 'status: ' + (status || '—') + ' · seq: ' + (seq || 0);
    }

    document.getElementById('bid').onclick = () => {
      if (!ws || ws.readyState !== 1) { feed('not connected'); return; }
      const amount = String(document.getElementById('amount').value || '11000');
      const clientBidId = 'cb_' + Date.now() + '_' + Math.random().toString(16).slice(2);
      ws.send(JSON.stringify({ type: 'BID_PLACE', auctionId: aid, serverTimeMs: Date.now(), data: { clientBidId, amountCents: amount } }));
      feed('sent BID_PLACE @ ' + amount);
    };

    document.getElementById('evidence').onclick = async () => {
      try {
        const ev = await (await fetch('/api/auctions/' + encodeURIComponent(aid) + '/evidence',
          { headers: { Authorization: 'Bearer ' + authToken } })).json();
        document.getElementById('evidence-out').textContent = JSON.stringify(ev, null, 2);
      } catch (e) {
        document.getElementById('evidence-out').textContent = String(e);
      }
    };

    connect();
  </script>
</body>
</html>
