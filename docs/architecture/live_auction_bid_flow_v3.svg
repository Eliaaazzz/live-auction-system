<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Live Auction Bid Hot Path v3</title>
  <desc id="desc">Bid submission flow showing the synchronous Redis Lua decision path and asynchronous persistence and fanout path.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
      .lane-title { font: 700 22px Arial, sans-serif; fill: #1e293b; }
      .node { stroke-width: 2; rx: 12; ry: 12; }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .edge { fill: #ede9fe; stroke: #7c3aed; }
      .core { fill: #dcfce7; stroke: #16a34a; }
      .data { fill: #fff7ed; stroke: #ea580c; }
      .guard { fill: #f1f5f9; stroke: #64748b; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .node-line { font: 400 16px Arial, sans-serif; fill: #334155; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .arrow-label { font: 700 15px Arial, sans-serif; fill: #334155; }
      .label-pill { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; ry: 8; }
      .pill-text { font: 700 14px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1700" height="980"/>
  <text class="title" x="60" y="60">Bid Hot Path v3</text>
  <text class="subtitle" x="60" y="88">The ACK path stays short; fanout, persistence, replay, and order creation are event driven and idempotent.</text>

  <rect class="lane" x="50" y="120" width="1600" height="230"/>
  <text class="lane-title" x="80" y="155">1. Synchronous decision path</text>

  <rect class="lane" x="50" y="390" width="1600" height="250"/>
  <text class="lane-title" x="80" y="425">2. Ordered event fanout and persistence</text>

  <rect class="lane" x="50" y="700" width="1600" height="205"/>
  <text class="lane-title" x="80" y="735">3. Correctness fences</text>

  <g id="mobile-client">
    <rect class="node client" data-check="node" x="80" y="205" width="215" height="92"/>
    <text class="node-title" data-check="text" data-owner="mobile-client" x="110" y="241">Mobile H5</text>
    <text class="node-line" data-check="text" data-owner="mobile-client" x="110" y="269">clientBidId, amount</text>
  </g>
  <g id="ws-gateway">
    <rect class="node edge" data-check="node" x="365" y="205" width="215" height="92"/>
    <text class="node-title" data-check="text" data-owner="ws-gateway" x="395" y="235">WS Gateway</text>
    <text class="node-line" data-check="text" data-owner="ws-gateway" x="395" y="261">auth, room</text>
    <text class="node-line" data-check="text" data-owner="ws-gateway" x="395" y="281">rate limit</text>
  </g>
  <g id="bid-engine">
    <rect class="node core" data-check="node" x="650" y="205" width="215" height="92"/>
    <text class="node-title" data-check="text" data-owner="bid-engine" x="680" y="241">Bid Engine</text>
    <text class="node-line" data-check="text" data-owner="bid-engine" x="680" y="269">script wrapper</text>
  </g>
  <g id="redis-lua">
    <rect class="node data" data-check="node" x="935" y="205" width="245" height="92"/>
    <text class="node-title" data-check="text" data-owner="redis-lua" x="965" y="241">Redis Lua</text>
    <text class="node-line" data-check="text" data-owner="redis-lua" x="965" y="269">validate, mutate, emit</text>
  </g>
  <g id="ack">
    <rect class="node core" data-check="node" x="1250" y="205" width="175" height="92"/>
    <text class="node-title" data-check="text" data-owner="ack" x="1280" y="241">ACK</text>
    <text class="node-line" data-check="text" data-owner="ack" x="1280" y="269">seq and result</text>
  </g>
  <g id="client-apply">
    <rect class="node client" data-check="node" x="1495" y="205" width="125" height="92"/>
    <text class="node-title" data-check="text" data-owner="client-apply" x="1515" y="241">Apply</text>
    <text class="node-line" data-check="text" data-owner="client-apply" x="1515" y="269">by seq</text>
  </g>

  <g id="redis-stream">
    <rect class="node data" data-check="node" x="405" y="475" width="260" height="92"/>
    <text class="node-title" data-check="text" data-owner="redis-stream" x="435" y="511">Redis Stream</text>
    <text class="node-line" data-check="text" data-owner="redis-stream" x="435" y="539">event log per auction</text>
  </g>
  <g id="pubsub">
    <rect class="node data" data-check="node" x="740" y="475" width="230" height="92"/>
    <text class="node-title" data-check="text" data-owner="pubsub" x="770" y="511">Redis Pub/Sub</text>
    <text class="node-line" data-check="text" data-owner="pubsub" x="770" y="539">room wakeup</text>
  </g>
  <g id="broadcast">
    <rect class="node edge" data-check="node" x="1045" y="475" width="230" height="92"/>
    <text class="node-title" data-check="text" data-owner="broadcast" x="1075" y="511">Broadcast</text>
    <text class="node-line" data-check="text" data-owner="broadcast" x="1075" y="539">drop stale seq</text>
  </g>
  <g id="persistence-worker">
    <rect class="node core" data-check="node" x="405" y="585" width="260" height="42"/>
    <text class="node-title" data-check="text" data-owner="persistence-worker" x="435" y="615">Persistence Worker</text>
  </g>
  <g id="mysql">
    <rect class="node data" data-check="node" x="740" y="585" width="230" height="42"/>
    <text class="node-title" data-check="text" data-owner="mysql" x="770" y="615">MySQL facts</text>
  </g>
  <g id="order-service">
    <rect class="node core" data-check="node" x="1045" y="585" width="230" height="42"/>
    <text class="node-title" data-check="text" data-owner="order-service" x="1075" y="615">Order Service</text>
  </g>
  <g id="reconnect">
    <rect class="node edge" data-check="node" x="1350" y="475" width="230" height="92"/>
    <text class="node-title" data-check="text" data-owner="reconnect" x="1380" y="511">Reconnect</text>
    <text class="node-line" data-check="text" data-owner="reconnect" x="1380" y="539">lastSeq catchup</text>
  </g>

  <g id="dedupe">
    <rect class="node guard" data-check="node" x="95" y="780" width="450" height="92"/>
    <text class="node-title" data-check="text" data-owner="dedupe" x="125" y="812">Idempotent commands</text>
    <text class="node-line" data-check="text" data-owner="dedupe" x="125" y="839">clientBidId maps retries</text>
    <text class="node-line" data-check="text" data-owner="dedupe" x="125" y="859">to the same ACK result.</text>
  </g>
  <g id="ordering">
    <rect class="node guard" data-check="node" x="625" y="780" width="450" height="92"/>
    <text class="node-title" data-check="text" data-owner="ordering" x="655" y="812">Per-auction ordering</text>
    <text class="node-line" data-check="text" data-owner="ordering" x="655" y="839">Only auction-local seq is required;</text>
    <text class="node-line" data-check="text" data-owner="ordering" x="655" y="859">no global order is needed.</text>
  </g>
  <g id="backpressure">
    <rect class="node guard" data-check="node" x="1155" y="780" width="450" height="92"/>
    <text class="node-title" data-check="text" data-owner="backpressure" x="1185" y="812">Fail early under load</text>
    <text class="node-line" data-check="text" data-owner="backpressure" x="1185" y="839">Reject or pause under load;</text>
    <text class="node-line" data-check="text" data-owner="backpressure" x="1185" y="859">never bypass Redis for bidding.</text>
  </g>

  <path class="arrow" d="M295 251 L365 251"/>
  <rect class="label-pill" x="305" y="217" width="52" height="24"/>
  <text class="pill-text" x="316" y="234">send</text>

  <path class="arrow" d="M580 251 L650 251"/>
  <rect class="label-pill" x="596" y="217" width="42" height="24"/>
  <text class="pill-text" x="606" y="234">call</text>

  <path class="arrow" d="M865 251 L935 251"/>
  <rect class="label-pill" x="878" y="217" width="48" height="24"/>
  <text class="pill-text" x="889" y="234">EVAL</text>

  <path class="arrow" d="M1180 251 L1250 251"/>
  <rect class="label-pill" x="1193" y="217" width="44" height="24"/>
  <text class="pill-text" x="1204" y="234">OK</text>

  <path class="arrow" d="M1425 251 L1495 251"/>
  <rect class="label-pill" x="1438" y="217" width="45" height="24"/>
  <text class="pill-text" x="1449" y="234">seq</text>

  <path class="arrow" d="M1058 297 L535 475"/>

  <path class="arrow" d="M1090 297 L855 475"/>

  <path class="arrow" d="M970 521 L1045 521"/>
  <path class="arrow" d="M1275 521 L1350 521"/>

  <path class="arrow" d="M535 567 L535 585"/>
  <path class="arrow" d="M665 606 L740 606"/>
  <path class="arrow" d="M970 606 L1045 606"/>

</svg>
