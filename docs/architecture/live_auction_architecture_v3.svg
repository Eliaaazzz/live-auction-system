<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Live Auction Architecture v3</title>
  <desc id="desc">Layered architecture for a live auction system using WebSocket, Redis Lua, Redis Stream, and MySQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .band-title { font: 700 22px Arial, sans-serif; fill: #1e293b; }
      .node { stroke-width: 2; rx: 12; ry: 12; }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .edge { fill: #ede9fe; stroke: #7c3aed; }
      .core { fill: #dcfce7; stroke: #16a34a; }
      .data { fill: #fff7ed; stroke: #ea580c; }
      .sidecar { fill: #fef3c7; stroke: #d97706; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .node-line { font: 400 16px Arial, sans-serif; fill: #334155; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .arrow-label { font: 700 15px Arial, sans-serif; fill: #334155; }
      .note { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 10; ry: 10; }
      .note-text { font: 700 17px Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1120"/>
  <text class="title" x="60" y="60">Live Auction Architecture v3</text>
  <text class="subtitle" x="60" y="88">Single-auction correctness is handled by Redis Lua; durable facts are written to MySQL through an idempotent event pipeline.</text>

  <rect class="band" x="50" y="115" width="1500" height="175" rx="16" ry="16"/>
  <text class="band-title" x="80" y="150">Client Layer</text>

  <rect class="band" x="50" y="330" width="1500" height="180" rx="16" ry="16"/>
  <text class="band-title" x="80" y="365">Edge Layer</text>

  <rect class="band" x="50" y="550" width="1500" height="300" rx="16" ry="16"/>
  <text class="band-title" x="80" y="585">Core Layer</text>

  <rect class="band" x="50" y="890" width="1500" height="170" rx="16" ry="16"/>
  <text class="band-title" x="80" y="925">Data Layer</text>

  <g id="admin-pc">
    <rect class="node client" data-check="node" x="115" y="175" width="300" height="90"/>
    <text class="node-title" data-check="text" data-owner="admin-pc" x="145" y="211">Admin PC</text>
    <text class="node-line" data-check="text" data-owner="admin-pc" x="145" y="239">products, rules, orders</text>
  </g>
  <g id="mobile-h5">
    <rect class="node client" data-check="node" x="470" y="175" width="300" height="90"/>
    <text class="node-title" data-check="text" data-owner="mobile-h5" x="500" y="211">Mobile H5</text>
    <text class="node-line" data-check="text" data-owner="mobile-h5" x="500" y="239">room, bids, ranking</text>
  </g>
  <g id="load-bot">
    <rect class="node client" data-check="node" x="825" y="175" width="300" height="90"/>
    <text class="node-title" data-check="text" data-owner="load-bot" x="855" y="211">Load Bot</text>
    <text class="node-line" data-check="text" data-owner="load-bot" x="855" y="239">k6 and WS pressure</text>
  </g>
  <g id="ops-dashboard">
    <rect class="node client" data-check="node" x="1180" y="175" width="300" height="90"/>
    <text class="node-title" data-check="text" data-owner="ops-dashboard" x="1210" y="211">Ops Dashboard</text>
    <text class="node-line" data-check="text" data-owner="ops-dashboard" x="1210" y="239">QPS, P95, lag, errors</text>
  </g>

  <g id="api-gateway">
    <rect class="node edge" data-check="node" x="115" y="395" width="270" height="90"/>
    <text class="node-title" data-check="text" data-owner="api-gateway" x="145" y="431">API Gateway</text>
    <text class="node-line" data-check="text" data-owner="api-gateway" x="145" y="459">TLS, routing, quotas</text>
  </g>
  <g id="rest-bff">
    <rect class="node edge" data-check="node" x="465" y="395" width="270" height="90"/>
    <text class="node-title" data-check="text" data-owner="rest-bff" x="495" y="431">REST BFF</text>
    <text class="node-line" data-check="text" data-owner="rest-bff" x="495" y="459">commands and queries</text>
  </g>
  <g id="ws-gateway">
    <rect class="node edge" data-check="node" x="815" y="395" width="270" height="90"/>
    <text class="node-title" data-check="text" data-owner="ws-gateway" x="845" y="431">WS Gateway</text>
    <text class="node-line" data-check="text" data-owner="ws-gateway" x="845" y="459">rooms, heartbeat, catchup</text>
  </g>
  <g id="auth-rate-limit">
    <rect class="node edge" data-check="node" x="1165" y="395" width="270" height="90"/>
    <text class="node-title" data-check="text" data-owner="auth-rate-limit" x="1195" y="431">Auth + Rate Limit</text>
    <text class="node-line" data-check="text" data-owner="auth-rate-limit" x="1195" y="459">seller and bidder policy</text>
  </g>

  <g id="auction-service">
    <rect class="node core" data-check="node" x="95" y="620" width="270" height="92"/>
    <text class="node-title" data-check="text" data-owner="auction-service" x="125" y="656">Auction Service</text>
    <text class="node-line" data-check="text" data-owner="auction-service" x="125" y="684">schedule, start, cancel</text>
  </g>
  <g id="bid-engine">
    <rect class="node core" data-check="node" x="455" y="620" width="270" height="92"/>
    <text class="node-title" data-check="text" data-owner="bid-engine" x="485" y="656">Bid Engine</text>
    <text class="node-line" data-check="text" data-owner="bid-engine" x="485" y="684">place_bid.lua owner</text>
  </g>
  <g id="timer-worker">
    <rect class="node core" data-check="node" x="815" y="620" width="270" height="92"/>
    <text class="node-title" data-check="text" data-owner="timer-worker" x="845" y="656">Timer Worker</text>
    <text class="node-line" data-check="text" data-owner="timer-worker" x="845" y="684">close_auction.lua owner</text>
  </g>
  <g id="order-service">
    <rect class="node core" data-check="node" x="1175" y="620" width="270" height="92"/>
    <text class="node-title" data-check="text" data-owner="order-service" x="1205" y="656">Order Service</text>
    <text class="node-line" data-check="text" data-owner="order-service" x="1205" y="684">idempotent order create</text>
  </g>

  <g id="persistence-worker">
    <rect class="node core" data-check="node" x="185" y="755" width="290" height="72"/>
    <text class="node-title" data-check="text" data-owner="persistence-worker" x="215" y="792">Persistence Worker</text>
    <text class="node-line" data-check="text" data-owner="persistence-worker" x="215" y="816">at-least-once consumer</text>
  </g>
  <g id="metrics-api">
    <rect class="node sidecar" data-check="node" x="535" y="755" width="250" height="72"/>
    <text class="node-title" data-check="text" data-owner="metrics-api" x="565" y="792">Metrics API</text>
    <text class="node-line" data-check="text" data-owner="metrics-api" x="565" y="816">QPS, P95, fanout lag</text>
  </g>
  <g id="ai-sidecar">
    <rect class="node sidecar" data-check="node" x="845" y="755" width="250" height="72"/>
    <text class="node-title" data-check="text" data-owner="ai-sidecar" x="875" y="792">AI Sidecar</text>
    <text class="node-line" data-check="text" data-owner="ai-sidecar" x="875" y="816">copy and audit logs</text>
  </g>
  <g id="replay-verifier">
    <rect class="node core" data-check="node" x="1155" y="755" width="290" height="72"/>
    <text class="node-title" data-check="text" data-owner="replay-verifier" x="1185" y="792">Replay Verifier</text>
    <text class="node-line" data-check="text" data-owner="replay-verifier" x="1185" y="816">stream correctness checks</text>
  </g>

  <g id="redis">
    <rect class="node data" data-check="node" x="150" y="950" width="590" height="88"/>
    <text class="node-title" data-check="text" data-owner="redis" x="180" y="982">Redis Hot Source</text>
    <text class="node-line" data-check="text" data-owner="redis" x="180" y="1005">state hash, leaderboard, dedupe</text>
    <text class="node-line" data-check="text" data-owner="redis" x="180" y="1027">stream, pub/sub, active ZSET</text>
  </g>
  <g id="mysql">
    <rect class="node data" data-check="node" x="860" y="950" width="590" height="88"/>
    <text class="node-title" data-check="text" data-owner="mysql" x="890" y="982">MySQL Fact Store</text>
    <text class="node-line" data-check="text" data-owner="mysql" x="890" y="1005">users, products, auctions, bids</text>
    <text class="node-line" data-check="text" data-owner="mysql" x="890" y="1027">orders, events, AI usage logs</text>
  </g>

  <path class="arrow" d="M265 265 L265 395"/>
  <text class="arrow-label" x="284" y="330">REST</text>
  <path class="arrow" d="M620 265 L910 395"/>
  <text class="arrow-label" x="710" y="330">BID_PLACE</text>
  <path class="arrow" d="M975 265 L960 395"/>
  <text class="arrow-label" x="984" y="330">load</text>
  <path class="arrow-dash" d="M1330 265 L1300 395"/>
  <text class="arrow-label" x="1340" y="330">metrics</text>

  <path class="arrow" d="M600 485 L255 620"/>
  <text class="arrow-label" x="370" y="545">admin commands</text>
  <path class="arrow" d="M950 485 L590 620"/>
  <text class="arrow-label" x="690" y="545">bid command</text>
  <path class="arrow" d="M950 485 L950 620"/>
  <text class="arrow-label" x="970" y="555">room events</text>
  <path class="arrow" d="M1300 485 L1310 620"/>
  <text class="arrow-label" x="1322" y="555">policy checks</text>

  <path class="arrow" d="M590 712 L445 955"/>
  <path class="arrow" d="M950 712 L560 955"/>
  <path class="arrow" d="M330 827 L1040 955"/>
  <path class="arrow" d="M1320 712 L1170 955"/>
  <path class="arrow-dash" d="M660 827 L660 955"/>
  <path class="arrow-dash" d="M970 827 L1045 955"/>

  <rect class="note" x="230" y="1070" width="1140" height="36"/>
  <text class="note-text" x="260" y="1094">Rule: Redis Lua decides every state transition; Redis Stream carries ordered events; MySQL stores durable facts with unique constraints.</text>
</svg>
