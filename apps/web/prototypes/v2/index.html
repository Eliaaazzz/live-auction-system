<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Auction — Room v2</title>

  <!-- Design notes (for the manager review pass — feel free to delete):
       =======================================================================
       Spec: high-value, single-item, transparent live auction. Backend state
       is authoritative (Redis Lua), AI is sidecar, video is non-authoritative.
       Source: docs/architecture.md, CLAUDE.md.

       Goals applied from PR #49 feedback:
         · No big "Leaderboard" — Top 3 podium only. Identity matters most for
           the people who are within striking distance; deeper ranks are noise.
         · Quick bid chips (+1% / +5% / +10% / MAX) instead of a number input
           that nobody types accurately mid-auction. Custom amount is still
           reachable but tucked away.
         · The screen should feel ALIVE — heat meter, rolling digits, particle
           trails, extend-pill swoop, sold-confetti. The transparency-first
           spec is the soul; the motion is the body.

       Aesthetic:
         · Dark ink stage; lava-orange `oklch(.72 .19 36)` as the heat colour;
           jade `oklch(.74 .14 165)` for "you're winning"; bone neutral for body.
         · Type: Space Grotesk (display + price), system body, JetBrains Mono
           for ids & seq. No Inter/Roboto.
         · Iconography minimal — labels do most of the work.
       ======================================================================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-stage: #07060a;
      --bg-room:  #0c0a14;
      --ink-1:    #f5f1ea;
      --ink-2:    #c8c1b4;
      --ink-3:    #807a6f;
      --ink-4:    #45413a;
      --line:     rgba(245,241,234,.08);
      --line-2:   rgba(245,241,234,.14);
      --hot:      oklch(0.74 0.19 36);
      --hot-2:    oklch(0.66 0.22 28);
      --hot-glow: oklch(0.78 0.21 40 / .55);
      --jade:     oklch(0.78 0.14 165);
      --jade-2:   oklch(0.66 0.15 165);
      --gold:     oklch(0.86 0.14 86);
      --silver:   oklch(0.82 0.01 90);
      --bronze:   oklch(0.68 0.10 50);
      --display:  'Space Grotesk', system-ui, sans-serif;
      --body:     system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      --mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      background: radial-gradient(ellipse at 50% -10%, #1a1326 0%, var(--bg-stage) 55%);
      color: var(--ink-1);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Stage holds the phone-sized room. Outside the room is decorative. */
    #stage{
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px 80px;
    }
    /* The "room" — single-column live auction screen */
    .room{
      width: 412px;
      max-width: calc(100vw - 24px);
      background: var(--bg-room);
      border: 1px solid var(--line-2);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 1px 0 rgba(255,255,255,.04) inset,
        0 30px 80px rgba(0,0,0,.45),
        0 60px 140px -40px oklch(0.6 0.2 36 / .15);
      isolation: isolate;
    }
    /* Stage decoration — soft beam behind the room */
    #stage::before{
      content:'';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, oklch(0.6 0.18 36 / .12), transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 80%, oklch(0.6 0.2 300 / .08), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .room{ z-index: 1; }

    /* Reset hover on phone-style buttons */
    button{ font-family: inherit; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="root"></div>
  </div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="effects.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>

</body>
</html>
