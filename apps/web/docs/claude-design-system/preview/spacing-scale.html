<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #fff; padding: 20px 24px; font-family: var(--font-sans); color: #0A1F44; }
  .row { display: grid; grid-template-columns: 56px 1fr 64px; align-items: center; gap: 12px; padding: 4px 0; }
  .name { font-family: var(--font-mono); font-size: 11px; color: #6b7a96; }
  .bar  { height: 14px; background: #0A1F44; border-radius: 2px; }
  .val  { font-family: var(--font-mono); font-size: 11px; color: #0A1F44; text-align: right; }
</style>
</head><body>
  <div class="row"><div class="name">--s-2</div>  <div class="bar" style="width:2px"></div>  <div class="val">2px</div></div>
  <div class="row"><div class="name">--s-4</div>  <div class="bar" style="width:4px"></div>  <div class="val">4px</div></div>
  <div class="row"><div class="name">--s-8</div>  <div class="bar" style="width:8px"></div>  <div class="val">8px</div></div>
  <div class="row"><div class="name">--s-12</div> <div class="bar" style="width:12px"></div> <div class="val">12px</div></div>
  <div class="row"><div class="name">--s-16</div> <div class="bar" style="width:16px"></div> <div class="val">16px</div></div>
  <div class="row"><div class="name">--s-20</div> <div class="bar" style="width:20px"></div> <div class="val">20px</div></div>
  <div class="row"><div class="name">--s-24</div> <div class="bar" style="width:24px"></div> <div class="val">24px</div></div>
  <div class="row"><div class="name">--s-32</div> <div class="bar" style="width:32px"></div> <div class="val">32px</div></div>
  <div class="row"><div class="name">--s-40</div> <div class="bar" style="width:40px"></div> <div class="val">40px</div></div>
  <div class="row"><div class="name">--s-56</div> <div class="bar" style="width:56px"></div> <div class="val">56px</div></div>
  <div class="row"><div class="name">--s-80</div> <div class="bar" style="width:80px"></div> <div class="val">80px</div></div>
</body></html>
