<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Leaderboard Row</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #171a28; padding: 16px; font-family: var(--font-sans); color: #f5f5f7; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 28px 28px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #1f2333; border: 1px solid rgba(255,255,255,0.06); }
  .row.lead { background: linear-gradient(90deg, rgba(201,169,97,0.18), rgba(201,169,97,0) 65%), #1f2333; border-color: rgba(201,169,97,0.45); box-shadow: 0 0 24px rgba(201,169,97,0.18); }
  .row.self { background: linear-gradient(90deg, rgba(37,244,238,0.16), rgba(37,244,238,0) 65%), #1f2333; border-color: rgba(37,244,238,0.45); }
  .row.rej  { background: #1f2333; border-color: rgba(255,77,112,0.45); animation: shake-x 0.28s var(--ease-snap); }
  .rank { font-family: var(--font-mono); font-size: 12px; color: #8b8fa3; text-align: center; }
  .av   { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #FE2C55, #cb203f); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .lead .av { background: linear-gradient(135deg, #C9A961, #b88a5a); color: #0A1F44; }
  .self .av { background: linear-gradient(135deg, #25F4EE, #0fb8b2); color: #0A1F44; }
  .name { font-size: 13px; font-weight: 600; }
  .name small { display: block; font-family: var(--font-mono); font-size: 10px; color: #8b8fa3; font-weight: 500; margin-top: 2px; }
  .bid  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }
  .lead .bid { color: #C9A961; }
  .self .bid { color: #25F4EE; }
  .rej  .bid { color: #ff4d70; }
  .seq  { font-family: var(--font-mono); font-size: 10px; color: #8b8fa3; min-width: 56px; text-align: right; }
</style>
</head><body>
  <div class="list">
    <div class="row lead"><div class="rank">01</div><div class="av">U2</div><div class="name">u_4221 · 领先<small>HK · device IOS</small></div><div class="bid">¥12,800</div><div class="seq">#14998</div></div>
    <div class="row self"><div class="rank">02</div><div class="av">YU</div><div class="name">YOU · 你<small>距离领先 -¥320</small></div><div class="bid">¥12,480</div><div class="seq">#14994</div></div>
    <div class="row"><div class="rank">03</div><div class="av">U7</div><div class="name">u_7811<small>BJ</small></div><div class="bid">¥12,200</div><div class="seq">#14990</div></div>
    <div class="row rej"><div class="rank">—</div><div class="av">U7</div><div class="name">u_7811 · ERR_TOO_LOW<small>tried ¥11,900 against ¥12,800</small></div><div class="bid">¥11,900</div><div class="seq">REJ</div></div>
  </div>
</body></html>
