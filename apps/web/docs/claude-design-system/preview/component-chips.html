<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Status Chips</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #fff; padding: 22px 24px; font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .lbl { width: 100%; font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: #6b7a96; text-transform: uppercase; margin-bottom: 2px; }
</style>
</head><body>
  <div class="row"><div class="lbl">Lifecycle pipeline</div>
    <span class="chip chip--draft">DRAFT</span>
    <span class="chip chip--vlm">VLM_REVIEW</span>
    <span class="chip chip--scheduled">SCHEDULED</span>
    <span class="chip chip--live">LIVE</span>
    <span class="chip chip--extended">EXTENDED · +5s</span>
    <span class="chip chip--sold">SOLD</span>
  </div>
  <div class="row"><div class="lbl">Terminal & failure</div>
    <span class="chip chip--no-bid">NO_BID</span>
    <span class="chip chip--cancelled">CANCELLED</span>
    <span class="chip chip--rejected">ERR_TOO_LOW</span>
    <span class="chip chip--rejected">ERR_OUT_OF_SEQ</span>
    <span class="chip chip--ai">AI · 仅供参考</span>
  </div>
</body></html>
