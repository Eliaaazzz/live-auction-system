<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Typography — Status Caps & Tracking</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #fff; padding: 22px 24px; font-family: var(--font-sans); color: #0A1F44; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
  .lbl { width: 100%; font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: #6b7a96; text-transform: uppercase; }
</style>
</head><body>
  <div class="row">
    <div class="lbl">Pipeline states · sentence-case never; tracking 0.12em</div>
    <span class="chip chip--draft">DRAFT</span>
    <span class="chip chip--vlm">VLM_REVIEW</span>
    <span class="chip chip--scheduled">SCHEDULED</span>
    <span class="chip chip--live">LIVE</span>
    <span class="chip chip--extended">EXTENDED · +5s</span>
    <span class="chip chip--sold">SOLD</span>
    <span class="chip chip--no-bid">NO_BID</span>
    <span class="chip chip--cancelled">CANCELLED</span>
    <span class="chip chip--rejected">ERR_TOO_LOW</span>
  </div>
  <div class="row">
    <div class="lbl">In-text mono badges</div>
    <span class="t-caps" style="color:#6b7a96">SEQ</span>
    <span class="t-mono-seq" style="font-size:13px;color:#0A1F44">#14998</span>
    <span style="width:8px"></span>
    <span class="t-caps" style="color:#6b7a96">Δ</span>
    <span class="t-mono" style="font-size:13px;color:#0A1F44">42ms</span>
    <span style="width:8px"></span>
    <span class="t-caps" style="color:#6b7a96">CHAIN</span>
    <span class="t-mono-hash" style="font-size:13px;color:#0A1F44">0x7af3…b21c</span>
  </div>
</body></html>
