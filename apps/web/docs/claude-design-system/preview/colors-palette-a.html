<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Palette A — Douyin Native</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #0f1220; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: 8px; padding: 12px 12px 14px; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(255,255,255,0.06); }
  .sw .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.9; }
  .sw .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.78; }
  .sw .var  { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw" style="background:#171a28; color:#f5f5f7;">
      <div class="name">douyin / ink</div>
      <div><div class="hex">#171A28</div><div class="var">--douyin-ink</div></div>
    </div>
    <div class="sw" style="background:#1f2333; color:#f5f5f7;">
      <div class="name">douyin / ink-soft</div>
      <div><div class="hex">#1F2333</div><div class="var">--douyin-ink-soft</div></div>
    </div>
    <div class="sw" style="background:#272b3d; color:#f5f5f7;">
      <div class="name">douyin / ink-2</div>
      <div><div class="hex">#272B3D</div><div class="var">--douyin-ink-2</div></div>
    </div>
    <div class="sw" style="background:#FE2C55; color:#fff;">
      <div class="name">douyin / red</div>
      <div><div class="hex">#FE2C55</div><div class="var">--douyin-red</div></div>
    </div>
    <div class="sw" style="background:#cb203f; color:#fff;">
      <div class="name">douyin / red-deep</div>
      <div><div class="hex">#CB203F</div><div class="var">--douyin-red-deep</div></div>
    </div>
    <div class="sw" style="background:#25F4EE; color:#0f1220;">
      <div class="name">douyin / cyan</div>
      <div><div class="hex">#25F4EE</div><div class="var">--douyin-cyan</div></div>
    </div>
  </div>
</body></html>
