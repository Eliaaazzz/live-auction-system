<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Typography — Serif Display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #F5EDDD; padding: 18px 24px; font-family: var(--font-sans); color: #0A1F44; position: relative; min-height: 240px; }
  .tag { font-family: var(--font-sans); font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: #a3873f; }
  .hammer { font-family: var(--font-serif); font-size: 88px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; color: #0A1F44; margin-top: 4px; font-feature-settings: "tnum"; }
  .sub { display: flex; gap: 18px; margin-top: 10px; font-family: var(--font-mono); font-size: 12px; color: #3a4b6d; align-items: baseline; }
  .sub b { color: #C9A961; font-weight: 700; letter-spacing: 0.14em; font-family: var(--font-sans); font-size: 11px; }
  .seal { position: absolute; right: 24px; top: 18px; width: 64px; height: 64px; }
  .rule { height: 1px; background: rgba(201,169,97,0.5); margin: 12px 0 10px; }
  .item { font-family: var(--font-serif); font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
</style>
</head><body>
  <img class="seal" src="../assets/icon-seal-verified.svg" alt=""/>
  <div class="tag">HAMMER · 落槌</div>
  <div class="item">青花瓷碗 · 清雍正</div>
  <div class="rule"></div>
  <div class="hammer">¥12,800.00</div>
  <div class="sub">
    <span><b>WINNER</b> u_8842</span>
    <span><b>SEQ</b> #14998</span>
    <span><b>Δ</b> 42ms</span>
  </div>
</body></html>
