<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Typography — UI Sans Scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #fff; padding: 22px 24px; font-family: var(--font-sans); color: #0A1F44; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid rgba(10,31,68,0.08); }
  .row:last-child { border: none; }
  .meta { width: 92px; flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; color: #6b7a96; }
  .sample { flex: 1; line-height: 1.1; }
</style>
</head><body>
  <div class="row"><div class="meta">40 · 700</div><div class="sample t-display">出价 ¥12,800</div></div>
  <div class="row"><div class="meta">32 · 700</div><div class="sample t-h1">实时直播竞拍</div></div>
  <div class="row"><div class="meta">24 · 600</div><div class="sample t-h2">青花瓷碗 · 清雍正</div></div>
  <div class="row"><div class="meta">18 · 600</div><div class="sample t-h3">您正在领先 · You lead</div></div>
  <div class="row"><div class="meta">16 · 400</div><div class="sample t-body">长按出价按钮，调出价格步进选择器，松开即出价。</div></div>
  <div class="row"><div class="meta">14 · 500</div><div class="sample t-meta">参与人数 8,442 · 出价 1,287</div></div>
  <div class="row"><div class="meta">12 · 500</div><div class="sample t-caption">AI · 仅供参考，不作为成交依据</div></div>
</body></html>
