<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Palette B — Auctionhouse Premium</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #f5edda; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: 8px; padding: 12px 12px 14px; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(10,31,68,0.10); }
  .sw .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .sw .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.78; }
  .sw .var  { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 2px; }
</style>
</head><body>
  <div class="grid">
    <div class="sw" style="background:#0A1F44; color:#F5EDDD;">
      <div class="name">solemn / deep</div>
      <div><div class="hex">#0A1F44</div><div class="var">--solemn-deep</div></div>
    </div>
    <div class="sw" style="background:#142a55; color:#F5EDDD;">
      <div class="name">solemn / deep-soft</div>
      <div><div class="hex">#142A55</div><div class="var">--solemn-deep-soft</div></div>
    </div>
    <div class="sw" style="background:#C9A961; color:#0A1F44;">
      <div class="name">solemn / gold</div>
      <div><div class="hex">#C9A961</div><div class="var">--solemn-gold</div></div>
    </div>
    <div class="sw" style="background:#dcbf7f; color:#0A1F44;">
      <div class="name">solemn / gold-soft</div>
      <div><div class="hex">#DCBF7F</div><div class="var">--solemn-gold-soft</div></div>
    </div>
    <div class="sw" style="background:#F5EDDD; color:#0A1F44; border-color: rgba(10,31,68,0.18);">
      <div class="name">solemn / cream</div>
      <div><div class="hex">#F5EDDD</div><div class="var">--solemn-cream</div></div>
    </div>
    <div class="sw" style="background:#b88a5a; color:#fff;">
      <div class="name">bridge / rose-gold</div>
      <div><div class="hex">#B88A5A</div><div class="var">--bridge-rose-gold</div></div>
    </div>
  </div>
</body></html>
