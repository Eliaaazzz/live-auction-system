<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Danger Modal · Cancel Auction</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: rgba(10,31,68,0.72); padding: 20px; font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; min-height: 270px; }
  .modal { width: 100%; max-width: 580px; background: #fff; border-radius: 12px; padding: 18px 20px 16px; box-shadow: 0 4px 12px -2px rgba(10,31,68,0.12), 0 24px 60px -20px rgba(10,31,68,0.32); border-top: 4px solid #cb203f; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .head h { font-size: 18px; font-weight: 700; color: #cb203f; flex: 1; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: #cb203f; }
  ul { margin: 6px 0 12px; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #3a4b6d; }
  ul li::marker { color: #cb203f; }
  .field { display: flex; align-items: center; gap: 10px; background: #f8f3e6; border: 1px dashed #b88a5a; border-radius: 6px; padding: 10px 12px; }
  .field label { font-family: var(--font-mono); font-size: 11px; color: #6b7a96; text-transform: uppercase; letter-spacing: 0.14em; }
  .field input { flex: 1; border: none; background: transparent; font-family: var(--font-mono); font-size: 16px; color: #cb203f; font-weight: 700; outline: none; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
  .btn { padding: 8px 16px; border-radius: 9999px; border: 1px solid transparent; font-weight: 600; font-size: 13px; cursor: pointer; }
  .btn.ghost  { border-color: rgba(10,31,68,0.12); background: #fff; color: #0A1F44; }
  .btn.danger { background: #cb203f; color: #fff; }
</style>
</head><body>
  <div class="modal">
    <div class="head">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cb203f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <h>取消本场拍卖 · Cancel auction</h>
      <span class="tag">DESTRUCTIVE · 2 STEP</span>
    </div>
    <ul>
      <li>所有买家收到 <b>AUCTION_CANCELLED</b> 推送 · all buyers receive cancel push.</li>
      <li>出价记录冻结 · bid records freeze.</li>
      <li>状态 LIVE → <b>CANCELLED</b> · event written to evidence chain.</li>
    </ul>
    <div class="field">
      <label>CONFIRM CURRENT PRICE</label>
      <input value="¥12,800.00" />
    </div>
    <div class="row">
      <button class="btn ghost">Keep auction live</button>
      <button class="btn danger">Cancel — write to chain</button>
    </div>
  </div>
</body></html>
