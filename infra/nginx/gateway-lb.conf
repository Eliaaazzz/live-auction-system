# gateway-lb.conf — demo load balancer in front of the two lumen gateways.
# Proves the gateways are stateless for room routing: REST + /ws + static all
# proxy through one upstream; whichever gateway a WS lands on, room events
# arrive via the Redis backbone with identical seq (see
# docs/demo/multi-gateway-demo.md).

upstream lumen_gateways {
    # least_conn keeps long-lived WS connections balanced across instances
    # (round-robin counts requests, not open sockets).
    least_conn;
    server lumen:8080;
    server lumen-gw2:8080;
}

server {
    listen 8088;

    # One block proxies everything (REST + /ws + static web). The Upgrade /
    # Connection headers are required for the WS handshake to pass through;
    # they are harmless on plain HTTP requests.
    location / {
        proxy_pass http://lumen_gateways;

        # WebSocket upgrade (nginx speaks HTTP/1.0 upstream by default,
        # which cannot carry an Upgrade handshake).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Idle WS connections: server PING cadence is 54s (pingPeriod =
        # pongWait*9/10, apps/lumen/internal/server/ws.go), so 300s never
        # cuts a healthy socket.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
