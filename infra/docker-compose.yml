# Lumen T1 local stack. `make up` brings up redis + mysql + ai-sidecar + lumen.
# e2e / verifier run on demand via the "tools" profile.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: lumen
      MYSQL_USER: lumen
      MYSQL_PASSWORD: lumen
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]
    # -h 127.0.0.1 forces TCP so health only flips after the REAL server listens
    # on 3306 (the first-run init temp server uses a socket on port 0).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 40

  ai-sidecar:
    build:
      context: ..
      dockerfile: apps/ai-sidecar/Dockerfile
    environment:
      SIDECAR_ADDR: ":8090"
    ports: ["8090:8090"]

  lumen:
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["serve", "--mode=all"]
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: dev
      ENABLE_DEV_LOGIN: "true"
      JWT_SECRET: change-me-local-only
      FRONTEND_ORIGIN: http://localhost:8080
      MYSQL_DSN: "lumen:lumen@tcp(mysql:3306)/lumen?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: redis:6379
      AI_SIDECAR_URL: http://ai-sidecar:8090
      # T9 chaos knob (V9 plan §10 timer-phase). Defaults to empty so prod
      # behaviour is unchanged; the chaos-timer Make target sets this to "1"
      # via `LUMEN_CHAOS_DISABLE_TIMER=1 docker compose up -d --force-recreate
      # lumen` so the Timer Worker goroutine is skipped at startup. See
      # apps/lumen/internal/server/server.go for the fail-closed check.
      LUMEN_CHAOS_DISABLE_TIMER: ${LUMEN_CHAOS_DISABLE_TIMER:-}
      # Surfaced by GET /version so "what's deployed?" is answerable. Set at
      # up time: LUMEN_BUILD_SHA=$(git rev-parse --short HEAD) docker compose ... up -d
      LUMEN_BUILD_SHA: ${LUMEN_BUILD_SHA:-}
      LUMEN_BUILD_TIME: ${LUMEN_BUILD_TIME:-}
    depends_on:
      redis: {condition: service_healthy}
      mysql: {condition: service_healthy}
      ai-sidecar: {condition: service_started}
    ports: ["8080:8080"]
    # V10k Tier A — OS-level tuning to unblock 10k+ concurrent WS:
    #   - file descriptors: default 1024 → 65536 (10k WS + Redis pool + spare)
    #   - accept queue: default somaxconn=128 → 4096 (5k connect storm in 15s
    #     overruns the default; raised so handshake queue doesn't drop SYNs)
    #   - SYN backlog: defends accept queue from SYN floods during ramp
    #   - send/recv buffers: 4 MiB default for outbound broadcast burst headroom
    #   - ephemeral port range: full 10000-65535 for outbound Redis/MySQL dials
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: 4096
      net.ipv4.tcp_max_syn_backlog: 8192
      net.ipv4.ip_local_port_range: "10000 65535"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["e2e"]
    environment:
      TARGET: http://lumen:8080
    depends_on:
      lumen: {condition: service_healthy}

  perf-smoke:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["perf-smoke"]
    environment:
      TARGET: http://lumen:8080
      # §4.2 fallback budgets (this is a single-gateway floor-check, not the SLO gate).
      PERF_BIDS: "200"
      PERF_ACK_P95_MS: "200"
      PERF_BCAST_P95_MS: "500"
    depends_on:
      lumen: {condition: service_healthy}

  load:
    # T8 P0 gate harness (V9 §10 / §4.2). Defaults exercise the gate; CI/dev
    # boxes can lower scale via env (LOAD_OBSERVERS etc.) so the same code is
    # the regression net for smaller runs too. Asserts ack/broadcast/script
    # p95 against §4.2 budgets and seqGap==0 — exits non-zero on breach so the
    # Make target can chain a `verify` step only when load itself passed.
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["load"]
    environment:
      TARGET: http://lumen:8080
      # P0 gate defaults; override per box in `make load LOAD_OBSERVERS=...`.
      LOAD_OBSERVERS: "500"
      LOAD_BIDDERS: "50"
      LOAD_DURATION_SEC: "60"
      LOAD_BID_INTERVAL_MS: "100"
      LOAD_ACK_P95_MS: "80"
      LOAD_BROADCAST_P95_MS: "150"
      LOAD_HAMMER_P95_MS: "500"
      LOAD_SCRIPT_P99_MS: "5"
      LOAD_AUCTION_DUR_SEC: "3600"
      LOAD_OBSERVER_STAGGER_MS: "10"
    depends_on:
      lumen: {condition: service_healthy}

  verifier:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["verify"]
    environment:
      APP_ENV: dev
      JWT_SECRET: change-me-local-only
      MYSQL_DSN: "lumen:lumen@tcp(mysql:3306)/lumen?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: redis:6379
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ─────────────────────────────────────────────────────────────────────
  # Observability profile — opt-in via `make up-obs` or
  # `docker compose --profile observability up -d --wait`.
  # Default `make up` keeps the T1 stack lean (redis + mysql + ai-sidecar + lumen).
  # ─────────────────────────────────────────────────────────────────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/recording.yml:/etc/prometheus/recording.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports: ["9090:9090"]
    depends_on:
      lumen: {condition: service_healthy}

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=lumen
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s
    ports: ["3000:3000"]
    depends_on:
      - prometheus

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.62.0
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports: ["9121:9121"]
    depends_on:
      redis: {condition: service_healthy}

  mysqld-exporter:
    profiles: ["observability"]
    image: prom/mysqld-exporter:v0.15.1
    command:
      - --config.my-cnf=/etc/mysqld_exporter.my.cnf
      - --mysqld.address=mysql:3306
    volumes:
      - ./mysql/mysqld_exporter.my.cnf:/etc/mysqld_exporter.my.cnf:ro
    ports: ["9104:9104"]
    depends_on:
      mysql: {condition: service_healthy}

  toxiproxy:
    profiles: ["toxiproxy"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"   # admin API
      - "18080:18080" # client -> lumen WS/HTTP proxy for WAN-latency preview
    depends_on:
      lumen: {condition: service_healthy}

  # ─────────────────────────────────────────────────────────────────────
  # Multi-gateway demo profile — opt-in via
  # `docker compose -f infra/docker-compose.yml --profile multigw up -d --build`.
  # Proves room-level WS routing across gateway instances: `lumen` (mode=all,
  # :8080) and `lumen-gw2` (mode=gateway, :8081) share one Redis backbone; a
  # bid accepted on either gateway is fanned out to clients on BOTH with the
  # same seq (hub.subscribe — apps/lumen/internal/server/ws.go). gateway-lb
  # (:8088) load-balances REST+WS across the two so a single URL demo works.
  # See docs/demo/multi-gateway-demo.md for the runbook.
  # ─────────────────────────────────────────────────────────────────────
  lumen-gw2:
    profiles: ["multigw"]
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["serve", "--mode=gateway"]
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: dev
      ENABLE_DEV_LOGIN: "true"
      JWT_SECRET: change-me-local-only
      FRONTEND_ORIGIN: http://localhost:8081
      MYSQL_DSN: "lumen:lumen@tcp(mysql:3306)/lumen?parseTime=true&loc=UTC&charset=utf8mb4"
      REDIS_ADDR: redis:6379
      AI_SIDECAR_URL: http://ai-sidecar:8090
      LUMEN_BUILD_SHA: ${LUMEN_BUILD_SHA:-}
      LUMEN_BUILD_TIME: ${LUMEN_BUILD_TIME:-}
    ports: ["8081:8080"]
    # Depends on `lumen` healthy so the mode=all process (timer + pg-writer)
    # is already running before this pure-gateway instance accepts clients.
    depends_on:
      redis: {condition: service_healthy}
      mysql: {condition: service_healthy}
      lumen: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway-lb:
    profiles: ["multigw"]
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/gateway-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8088:8088"]
    depends_on:
      lumen: {condition: service_healthy}
      lumen-gw2: {condition: service_healthy}

volumes:
  prometheus-data:
  grafana-data:
