# 火山云 (Volcengine) production stack — lumen + ai-sidecar + Caddy (auto-TLS).
#
# MySQL + Redis are MANAGED cloud services (云数据库MySQL版 + 缓存Redis版), NOT
# containers — so this is a standalone compose (run it ALONE, not layered on the
# base infra/docker-compose.yml which ships local mysql/redis).
#
#   # from the repo root, with secrets exported (see infra/.env.prod.example):
#   docker compose -f infra/docker-compose.prod.yml up -d --build --wait
#
# Secrets come from the shell env / infra/.env.prod — NEVER commit them
# (docs/secrets-workflow.md). The `${VAR:?msg}` form fails fast if a required
# secret is missing.
services:
  ai-sidecar:
    build:
      context: ..
      dockerfile: apps/ai-sidecar/Dockerfile
    restart: unless-stopped
    environment:
      SIDECAR_ADDR: ":8090"
    expose: ["8090"]

  lumen:
    build:
      context: ..
      dockerfile: apps/lumen/Dockerfile
    command: ["serve", "--mode=all"]
    restart: unless-stopped
    # Hard cgroup cap so a real OOM is an observable oom_kill (exit 137), not a
    # silent host kill, and so GOMEMLIMIT below stays BOUNDED — it can never grow
    # the heap toward the host and starve ai-sidecar+caddy on the 8 GiB box.
    mem_limit: 5g
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: prod
      ENABLE_DEV_LOGIN: "false" # §8 baseline: dev-login OFF in prod (config.go enforces)
      # ---- deploy identity for /version (prevents stale-binary/schema drift) ----
      LUMEN_BUILD_SHA: "${LUMEN_BUILD_SHA:-unknown}"
      LUMEN_BUILD_TIME: "${LUMEN_BUILD_TIME:-unknown}"
      # ---- managed cloud endpoints (intranet addresses from the console) ----
      # MySQL may be supplied as MYSQL_DSN or as MYSQL_HOST + component fields.
      # config.Load fails fast in APP_ENV=prod when neither path is set.
      MYSQL_DSN: "${MYSQL_DSN:-}"
      REDIS_ADDR: "${REDIS_ADDR:?set to the 缓存Redis版 intranet host:port}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      # ---- secrets (shell env / infra/.env.prod; never commit) ----
      JWT_SECRET: "${JWT_SECRET:?set a strong non-default JWT secret}"
      EVIDENCE_HMAC_KEY: "${EVIDENCE_HMAC_KEY:?set a strong non-default evidence key}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?set to https://<your-domain>}"
      AI_SIDECAR_URL: http://ai-sidecar:8090
      # ---- V10k Tier A: GC + memory governance (2026-06-07 load-test tuned) ----
      # GOMEMLIMIT raised 2GiB→3750MiB (~75% of mem_limit) to relieve the GC
      # death-spiral seen at ~15k conns (ack p95 ramp to 110ms while CPU only 0.65
      # and bandwidth unsaturated — a GC-thrash signature, not a panic), but BOUNDED
      # by mem_limit so it can never starve the co-tenants. gctrace + GOTRACEBACK=crash
      # capture OOM-vs-panic on the next cliff (the 2026-06-07 crash zeroed /metrics
      # with no captured cause).
      GOGC: "200"
      GOMEMLIMIT: "3750MiB"
      GODEBUG: "gctrace=1"
      GOTRACEBACK: "crash"
      # ---- front-door admission + per-conn memory knobs (see apps/lumen/internal/server/ws.go) ----
      # MAX_WS_CONNS: shed new WS upgrades with 503 + Retry-After past this watermark
      # (graceful degradation instead of the OOM crash proven at ~15.7k). 0 = disabled.
      # ~12000 fits a 4 vCPU/8 GiB box; re-baseline with the wsload 14k-overload run.
      MAX_WS_CONNS: "${MAX_WS_CONNS:-12000}"
      # WS_CRIT_FRAMES: per-conn crit+broadcast lane depth (default 512; must stay
      # > catchupMaxGap=200). 1024→512 reclaims ~72 KiB/conn (~1 GiB at 15k).
      WS_CRIT_FRAMES: "${WS_CRIT_FRAMES:-512}"
      # ROOM_STATE_PATCH_MIN_VIEWERS: coalesce per-bid broadcasts into ≤20/s patches
      # for rooms ≥ this size (1000→200 so 200-viewer rooms also coalesce, closing
      # the only burst exposure of the smaller crit lane).
      ROOM_STATE_PATCH_MIN_VIEWERS: "${ROOM_STATE_PATCH_MIN_VIEWERS:-200}"
      # PPROF_ADDR: loopback-only pprof for crash forensics; NEVER bind a public iface.
      PPROF_ADDR: "${PPROF_ADDR:-127.0.0.1:6060}"
      # GATEWAY_ROOM_AFFINITY: multi-gateway room-level routing isolation — a gateway
      # only reads/fans out rooms it has local members for (vs every gateway reading
      # every room). DEFAULT OFF; enable ONLY in a multi-gateway deploy that also
      # pins a consistent room->gateway shard at the LB. Single-process mode=all
      # ignores it (inert).
      GATEWAY_ROOM_AFFINITY: "${GATEWAY_ROOM_AFFINITY:-}"
      MYSQL_HOST: "${MYSQL_HOST:-}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-lumen}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lumen}"
      MYSQL_TLS: "${MYSQL_TLS:-}"
      # ---- 火山直播 (optional; unset → the room falls back to the sim sheen) ----
      VOLCENGINE_LIVE_PUSH_DOMAIN: "${VOLCENGINE_LIVE_PUSH_DOMAIN:-}"
      VOLCENGINE_LIVE_PLAY_DOMAIN: "${VOLCENGINE_LIVE_PLAY_DOMAIN:-}"
      VOLCENGINE_LIVE_SIGN_KEY: "${VOLCENGINE_LIVE_SIGN_KEY:-}"
    depends_on:
      ai-sidecar: {condition: service_started}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    # V10k Tier A — OS tuning to unblock 10k+ concurrent WS (mirrors the base).
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    sysctls:
      net.core.somaxconn: 4096
      net.ipv4.tcp_max_syn_backlog: 8192
      net.ipv4.ip_local_port_range: "10000 65535"

  # TLS terminator + reverse proxy. Caddy auto-provisions + renews a Let's
  # Encrypt cert for $LUMEN_DOMAIN and transparently upgrades WebSocket (wss).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      lumen: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    environment:
      LUMEN_DOMAIN: "${LUMEN_DOMAIN:?set to your registered domain, e.g. auction.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
