# Lumen Auction self-hosted SRS config for issue #121.
# Video is display-only. It must not participate in bid adjudication, auction
# state transitions, Redis Lua, Redis Streams, or replay verification.

listen              1935;
max_connections     2000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
        hls_cleanup     on;
    }

    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }
}
