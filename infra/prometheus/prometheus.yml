# Prometheus scrape config for Lumen Auction.
# See docs/components/13-observability.md for the metrics catalog this config feeds.
#
# T1 reality (per PR #19): lumen runs as `--mode=all` (single process, port 8080)
# with the ai-sidecar as a separate process. So the default scrape config has
# ONE lumen target. The multi-process targets below (bid-engine, gateway, timer,
# pg-writer-as-persistence, api) are commented out — uncomment when T5 splits
# them via compose so prometheus doesn't redden with DOWN targets in T1.
#
# Scrape intervals:
#   - hot   (5s):  lumen — drives the ack/broadcast SLO graphs
#   - warm (10s):  ai-sidecar
#   - cold (30s):  redis, mysql — capacity/health, not SLO

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: lumen-local

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # P0 = no alertmanager wired; alerts surface in Grafana panels

scrape_configs:
  # ─────────────────────────────────────────────────────────────────────
  # T1 default: single lumen process exposes all modes' metrics on :8080
  # ─────────────────────────────────────────────────────────────────────
  - job_name: lumen
    scrape_interval: 5s
    static_configs:
      - targets: ['lumen:8080']
        labels: { mode: all }

  - job_name: ai-sidecar
    scrape_interval: 10s
    static_configs:
      - targets: ['ai-sidecar:9090']

  # Cold path — capacity / health (only when exporters are deployed)
  - job_name: redis
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: mysql
    scrape_interval: 30s
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: prometheus-self
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  # ─────────────────────────────────────────────────────────────────────
  # T5+ multi-process topology (per-mode containers). Uncomment when
  # compose splits into separate services.
