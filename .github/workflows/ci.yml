name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      # Redis + MySQL are provided so EVERY integration test runs as a real gate —
      # nothing is skipped in CI (redis-backed Lua hot path; MySQL-backed
      # persistence worker + in-process server harness for the REST/WS tests).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: lumen
          MYSQL_USER: lumen
          MYSQL_PASSWORD: lumen
        ports:
          - 3306:3306
        # -h 127.0.0.1 forces TCP so health only flips after the REAL server listens.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      REDIS_ADDR: 127.0.0.1:6379
      MYSQL_DSN: "lumen:lumen@tcp(127.0.0.1:3306)/lumen?parseTime=true&loc=UTC&charset=utf8mb4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: load MySQL schema
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -ulumen -plumen lumen -e "SELECT 1" >/dev/null 2>&1; then break; fi
            echo "waiting for mysql ($i)"; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -ulumen -plumen lumen < infra/mysql/init/01-schema.sql
      - name: tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "go.mod/go.sum not tidy — run 'go mod tidy' and commit"; exit 1; }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt' && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + redis + mysql integration; no test skipped)
        run: |
          set -euo pipefail
          go test -race -v ./... 2>&1 | tee /tmp/gotest.txt
          (cd tools/chaos-runner && go test -race -v ./...) 2>&1 | tee -a /tmp/gotest.txt
          if grep -q -- '--- SKIP' /tmp/gotest.txt; then
            echo "FAIL: a test was SKIPPED in CI (all infra must be provided so nothing skips)";
            grep -- '--- SKIP' /tmp/gotest.txt; exit 1
          fi
      - name: fuzz smoke (review-discovered Go boundaries)
        run: |
          set -euo pipefail
          FUZZTIME=5s bash scripts/fuzz-discover.sh
      - name: ws coalescing race gate
        run: bash scripts/ws-coalescing-race-gate.sh

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no *_v2.lua naming (V9)
        run: |
          if git grep -nI '_v2' -- '*.lua'; then echo "FAIL: *_v2.lua banned"; exit 1; fi
      - name: no real DOUBAO endpoint id (pattern-based; placeholder allowlisted)
        run: |
          # match a real ep-<digits> id; the ep-xxxx placeholder has no digits, and
          # this regex contains no secret literal (so the guard can't match itself).
          if git grep -nE 'ep-[0-9]{8}'; then echo "FAIL: real DOUBAO endpoint id present"; exit 1; fi
      - name: contracts present
        run: |
          for f in ws-envelope redis-keys error-codes db-schema ai-events; do
            test -f "proto/$f.md" || (echo "missing proto/$f.md"; exit 1); done
      - name: runner-up-pays fixture verifier
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          bash scripts/runner-up-pays-fixtures-check.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build + start stack (wait for healthchecks)
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300 redis mysql ai-sidecar lumen
      - name: sanity healthz
        run: curl -sf http://localhost:8080/healthz
      - name: seed
        run: docker compose -f infra/docker-compose.yml exec -T lumen /lumen seed
      - name: e2e-dummy-bid (T1 acceptance)
        run: |
          set -euo pipefail
          out="$(docker compose -f infra/docker-compose.yml --profile tools run --rm --build e2e)"
          echo "$out"
          aid="$(printf '%s\n' "$out" | sed -n 's/^E2E_AUCTION_ID=//p' | tail -n1)"
          test -n "$aid" || { echo "missing E2E_AUCTION_ID from e2e output"; exit 1; }
          echo "VERIFY_AID=$aid" >> "$GITHUB_ENV"
      - name: perf-smoke (T2 ack/broadcast p95 floor-check)
        run: docker compose -f infra/docker-compose.yml --profile tools run --rm --build perf-smoke
      - name: replay-verifier skeleton
        run: docker compose -f infra/docker-compose.yml --profile tools run --rm --build -e VERIFY_AID="$VERIFY_AID" verifier
      - name: verify-evidence (T4 hash-chain gate; exit!=0 on hash_break)
        run: docker compose -f infra/docker-compose.yml exec -T lumen /lumen verify-evidence --auction "$VERIFY_AID"
      - name: demo-auction + 6 mode demos (issue #114 acceptance + anti-snipe/hammer/evidence)
        # `make demo-smoke` wraps these locally but adds load-smoke + chaos-smoke
        # which we already run separately below. This step runs only the
        # asserted demo-* targets — each spins a full auction lifecycle (create
        # → freeze → start → bid → hammer → evidence) inside the running stack
        # and exit-codes on its own invariant (sudden-death no-extend, sealed
        # reveal hides amounts during LIVE, vickrey 2nd-price, hybrid leader
        # redaction, all-pay forfeit + NO ORDER, prequalify recommender-seeded
        # spawn-formal). Added 2026-06-06 after demo-prequalify regression was
        # caught by a local make demo-smoke run on c6701c1 (#225). CI doesn't
        # need the full demo-smoke wrapper because chaos/load/AI-offline are
        # already gates in this job; only the asserted scenario demos were
        # ungated.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          make demo-auction
          make demo-sudden-death
          make demo-sealed
          make demo-vickrey
          make demo-hybrid
          make demo-allpay
          make demo-prequalify
      - name: e2e-ai-offline (T7-5 chaos gate; V9 P3 — bid path independent of AI)
        # Per issue #70 §4.5. Stops the ai-sidecar container, re-runs
        # e2e-dummy-bid (must exit 0), restarts sidecar, re-runs once
        # more (recovery). Any failure = AI is leaking into the bid
        # path, which violates V9 P3.
        run: make e2e-ai-offline
      - name: chaos-smoke (T9 chaos harness regression net; AI phase only)
        # Wraps `make chaos-ai` which is the cheapest of the 5 V9 §10
        # drills (it composes on top of e2e-ai-offline which already
        # ran). Wiring it here keeps the chaos harness as a CI gate
        # so a refactor that breaks `lumen chaos --phase=...` fails
        # loudly. The other 4 drills (redis/mysql/ws/timer) involve
        # docker-compose restarts that would roughly 3x this job's
        # wall-clock — they're local-run gates for the demo runbook
        # (see docs/t9-chaos.md §5).
        timeout-minutes: 3
        run: make chaos-smoke
      - name: load-smoke (T8 instrumentation regression net + post-load Verifier)
        # Drives the lumen load harness at CI-cheap scale (25/5/10s) against
        # the running stack. Exits non-zero on any §4.2 budget breach + seqGap
        # > 0; then chains `make verify` on the post-load auction so V9 §9
        # Verifier-consistent gate runs on a real-traffic auction (not just
        # the dummy e2e seed). MAXLEN trim alignment is documented in
        # docs/perf-report.md — at this scale the stream is well under it.
        timeout-minutes: 5
        run: make load-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install web deps for smoke
        working-directory: apps/web
        # `npm install` (not ci) for the same reason as the web job (vitest 4 /
        # vite 5 esbuild minor split: lockfile captures the top-level only).
        run: npm install --no-audit --no-fund
      - name: frontend smoke scripts (TC-T6 wire/catchup/schema/401/antisnipe/snapshot)
        # T6 smoke scripts that drive the running backend through the same
        # contract surface the browser uses. Wired here because the stack is
        # up; per the team rule "no skipped CI tests" these run on every push.
        # Sequential execution preserves deterministic shared-state behavior
        # with existing fixtures (smoke-wire uses seeded auc_demo; the other
        # smoke scripts create their own auctions as needed; wall time is
        # bounded).
        timeout-minutes: 5
        working-directory: apps/web
        run: |
          # VERIFY_AID is the early e2e/verifier auction. After the longer
          # demo/chaos/load gates it may be SOLD, so do not leak it into
          # browser-contract smoke tests. smoke-wire falls back to seeded
          # auc_demo, which Seed keeps LIVE for one hour.
          unset VERIFY_AID AUCTION_ID
          npm run -s smoke:all
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - name: teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # Frontend gate — runs the Vitest suite (114 unit + component tests) as a
  # tests-as-gate, not tests-on-disk (per #65 review). Smoke scripts that
  # need a live backend (smoke:catchup / antisnipe / snapshot / 401 / wire /
  # schema) deliberately NOT wired here — they belong in the e2e job which
  # already has docker-compose up. Adding them is a follow-up once the
  # smoke runtimes are tightened (anti-snipe is ~12s, snapshot-fallback
  # ~30s; both need to be parallelizable before they're worth a CI minute).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install
        # `npm install` (not `npm ci`) because vitest 4 nests its own
        # vite which pulls esbuild ^0.27 — while the top-level vite 5
        # pins esbuild 0.21. Both versions are legitimate but the
        # lockfile generated on darwin captures only the top-level. CI
        # on linux runs `npm ci` strict mode and bails on the nested
        # esbuild gap. `npm install` resolves at install time and is
        # equally deterministic for unit tests (no network resolution
        # changes the actual test surface).
        run: npm install --no-audit --no-fund
      - name: design-tokens drift check
        # Per #56 ratify (PDGGK 2026-05-27): B's token CSS is generated
        # from A (apps/web/src/styles.css :root). This check regenerates
        # the artifacts and fails if styles.css drifted without a
        # matching commit to docs/design-tokens.{json,generated.css}.
        run: npm run tokens:check
      - name: build
        run: npm run build
      - name: test
        run: npm test
