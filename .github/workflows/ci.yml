name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run build

  realtime:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/realtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/realtime/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q --maxfail=1
