# Dev environment. `docker compose up` brings up the full stack.
# Production deploy uses different orchestration.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  realtime:
    build: ./apps/realtime
    environment:
      DATABASE_URL: postgres://lumen:lumen@postgres:5432/lumen?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AI_BASE_URL: http://ai:8000
      LISTEN_ADDR: ":8080"
      JWT_SECRET: dev-secret-do-not-use-in-prod
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ai:
    build: ./apps/ai
    environment:
      MODEL_DEVICE: cpu   # set to "cuda" if GPU available
      LOG_LEVEL: info
    ports: ["8000:8000"]
    # Mount HuggingFace cache if you want pre-downloaded models
    # volumes:
    #   - ~/.cache/huggingface:/root/.cache/huggingface

  web:
    build: ./apps/web
    environment:
      VITE_API_BASE: http://localhost:8080/api
      VITE_WS_BASE: ws://localhost:8080
    ports: ["5173:5173"]
    depends_on:
      - realtime

volumes:
  pgdata:
  redisdata:
